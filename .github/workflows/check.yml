name: Cross-platform checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load Windows C++ compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        run: choco install nasm --yes --no-progress
      - name: Add NASM to Windows PATH
        if: runner.os == 'Windows'
        run: '"C:\Program Files\NASM" >> $env:GITHUB_PATH'
      - name: Install NASM on macOS
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Rust tests with native clock
        run: cargo test --locked --manifest-path part2/Cargo.toml
      - name: Rust tests with portable clock
        run: cargo test --locked --manifest-path part2/Cargo.toml --features portable-timer
      - name: Part 1 runner tests
        run: python -m unittest discover -s part1
      - name: Part 2 runner tests
        run: python -m unittest discover -s part2
      - name: Part 1 round trips
        run: python part1/exercise.py check
      - name: Haversine correctness
        run: python part2/exercise.py correctness
      - name: Compare with Casey
        run: python part2/compare_casey.py check
      - name: Benchmark with page-fault accounting
        run: python part2/compare_casey.py benchmark --pairs 10000 --repeats 2
